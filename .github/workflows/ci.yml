name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: terraform (fmt, validate, tflint, checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: fmt
        run: terraform fmt -check -recursive infra

      - name: validate (platform e catalog)
        run: |
          for root in infra/envs/dev/platform infra/envs/dev/catalog; do
            echo "::group::$root"
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          cd infra && tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: checkov
        run: |
          pip install --quiet checkov==3.4.3
          checkov -d infra --framework terraform --compact --quiet

  spark:
    name: pipeline (pytest, ${{ matrix.format }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        format: [delta, parquet]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: pytest
        env:
          LAKEHOUSE_FORMAT: ${{ matrix.format }}
        run: pytest -q
