[project]
name = "lakehouse-azure-iac"
version = "0.1.0"
description = "Pipeline medallion INMET/IBGE para Azure Databricks"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# MatchStrategy(str, Enum) vem do projeto 13 e e mantido igual.
ignore = ["UP042"]
